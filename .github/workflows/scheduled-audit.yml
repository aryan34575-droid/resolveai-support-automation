name: ResolveAI scheduled audit
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m src.main --github-issues --since-days 7 > resolveai-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: resolveai-scheduled-report
          path: resolveai-report.json
